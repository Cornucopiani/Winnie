<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Support Dashboard</title>
<style>
:root {
  --bg:#0f172a; --panel:#1e293b; --panel2:#273548; --border:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --green:#22c55e;
  --yellow:#eab308; --red:#ef4444; --orange:#f97316; --purple:#a78bfa;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{padding:20px 28px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{margin:0;font-size:22px}
header .meta{color:var(--muted);font-size:13px}
.container{max-width:1400px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:28px;font-weight:700}
.card .sub{color:var(--muted);font-size:12px;margin-top:4px}
.score{font-size:48px;font-weight:800}
.score.good{color:var(--green)} .score.warn{color:var(--yellow)} .score.bad{color:var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge.critical{background:#7f1d1d;color:#fecaca}
.badge.high{background:#7c2d12;color:#fed7aa}
.badge.medium{background:#713f12;color:#fef08a}
.badge.low{background:#1e3a8a;color:#bfdbfe}
.badge.ok{background:#14532d;color:#bbf7d0}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.section>summary,.section-header{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;border-bottom:1px solid var(--border)}
.section .body{padding:16px 18px}
details.section{padding:0}
details.section summary{list-style:none}
details.section summary::-webkit-details-marker{display:none}
details.section[open] .chev{transform:rotate(90deg)}
.chev{transition:transform .2s}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
tr:hover td{background:var(--panel2)}
.search{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);margin-bottom:10px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:4px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.issue{padding:10px 12px;border-left:3px solid var(--red);background:var(--panel2);border-radius:6px;margin-bottom:8px}
.issue.medium{border-color:var(--yellow)} .issue.low{border-color:var(--accent)} .issue.critical{border-color:#f43f5e}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:8px;background:var(--panel2);cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);color:#0f172a;font-weight:600}
.empty{color:var(--muted);font-style:italic;padding:12px}
@media print{body{background:#fff;color:#000}.section{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div>
    <h1>IT Support Dashboard</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div style="text-align:right">
    <div class="score" id="score">--</div>
    <div class="meta">Health Score</div>
  </div>
</header>
<div class="container">
  <div class="grid" id="cards"></div>
  <div class="section" style="padding:16px 18px">
    <h3 style="margin:0 0 10px;color:var(--muted);font-size:13px;text-transform:uppercase">Issues & Findings</h3>
    <div id="issues"></div>
  </div>

  <details class="section" open><summary><span>System & Hardware</span><span class="chev">▶</span></summary><div class="body" id="sec-system"></div></details>
  <details class="section"><summary><span>Storage</span><span class="chev">▶</span></summary><div class="body" id="sec-storage"></div></details>
  <details class="section"><summary><span>Network</span><span class="chev">▶</span></summary><div class="body" id="sec-network"></div></details>
  <details class="section"><summary><span>Performance</span><span class="chev">▶</span></summary><div class="body" id="sec-perf"></div></details>
  <details class="section"><summary><span>Processes</span><span class="chev">▶</span></summary><div class="body" id="sec-proc"></div></details>
  <details class="section"><summary><span>Services</span><span class="chev">▶</span></summary><div class="body" id="sec-svc"></div></details>
  <details class="section"><summary><span>Event Logs</span><span class="chev">▶</span></summary><div class="body" id="sec-events"></div></details>
  <details class="section"><summary><span>Windows Updates</span><span class="chev">▶</span></summary><div class="body" id="sec-updates"></div></details>
  <details class="section"><summary><span>Drivers & Devices</span><span class="chev">▶</span></summary><div class="body" id="sec-drivers"></div></details>
  <details class="section"><summary><span>Installed Software</span><span class="chev">▶</span></summary><div class="body" id="sec-software"></div></details>
  <details class="section"><summary><span>Security</span><span class="chev">▶</span></summary><div class="body" id="sec-security"></div></details>
  <details class="section"><summary><span>Users & Accounts</span><span class="chev">▶</span></summary><div class="body" id="sec-users"></div></details>
  <details class="section"><summary><span>Reliability & Crashes</span><span class="chev">▶</span></summary><div class="body" id="sec-reliability"></div></details>
</div>

<script>
window.__DATA__ = __DATA_PLACEHOLDER__;
</script>
<script>
const D = window.__DATA__ || {};
const $ = (id)=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kv(obj, keys){ let h='<dl class="kv">'; keys.forEach(k=>{ h+=`<dt>${esc(k[0])}</dt><dd>${esc(k[1])}</dd>`;}); return h+'</dl>'; }
function table(headers, rows, filterId){
  let h = filterId ? `<input class="search" placeholder="Filter..." oninput="filterTable('${filterId}',this.value)">` : '';
  h += '<table id="'+(filterId||'')+'"><thead><tr>'+headers.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{ h+='<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>';});
  h+='</tbody></table>';
  if(!rows.length) h+='<div class="empty">No data</div>';
  return h;
}
function filterTable(id,q){ q=q.toLowerCase(); document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>{ tr.style.display = tr.textContent.toLowerCase().includes(q)?'':'none'; }); }
function bar(pct){ return `<div class="bar"><div style="width:${Math.min(100,pct)}%"></div></div>`; }

// meta + score
const m = D.meta||{};
$('meta').textContent = `${m.hostname||''}  •  ${m.collectedAt||''}  •  v${m.toolVersion||''}  •  ${m.elevated?'Elevated':'Not elevated'}`;
const sc = (D.health||{}).score;
const scoreEl = $('score');
scoreEl.textContent = sc!=null?sc:'--';
scoreEl.className = 'score ' + (sc>=80?'good':sc>=50?'warn':'bad');

// cards
const cards = [
  ['CPU Load', (D.performance||{}).cpuLoadPercent, '%', (D.performance||{}).cpuLoadPercent>=90?'bad':''],
  ['RAM Used', (D.performance||{}).memoryUsedPercent, '%', (D.performance||{}).memoryUsedPercent>=90?'bad':''],
  ['Uptime', (D.system||{}).uptimeHours, 'h', ''],
  ['Pending Updates', (D.updates||{}).pendingCount, '', (D.updates||{}).pendingCount>0?'warn':''],
  ['Problem Devices', (D.drivers||{}).problemCount, '', (D.drivers||{}).problemCount>0?'warn':''],
  ['Failed Services', ((D.services||{}).failedAuto||[]).length, '', ((D.services||{}).failedAuto||[]).length>0?'bad':''],
  ['Event Errors', (D.events||{}).total, '', (D.events||{}).total>20?'warn':''],
  ['Installed Apps', (D.software||{}).count, '', ''],
];
const cEl = $('cards');
cards.forEach(([t,v,u,cls])=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<h3>${esc(t)}</h3><div class="val ${cls}">${esc(v)}<span style="font-size:14px;color:var(--muted)">${esc(u)}</span></div>`;
  cEl.appendChild(d);
});

// issues
const issuesEl = $('issues');
const issues = (D.health||{}).issues||[];
if(!issues.length){ issuesEl.innerHTML='<div class="empty">No issues detected</div>'; }
else {
  issuesEl.innerHTML = issues.map(i=>`<div class="issue ${i.severity}"><span class="badge ${i.severity}">${esc(i.severity)}</span> <strong>${esc(i.area)}</strong> — ${esc(i.message)}</div>`).join('');
}

// system
(function(){
  const s=D.system||{}, h=D.hardware||{};
  let html = kv(s, [
    ['Hostname',s.hostname],['OS',s.os],['Version',s.osVersion],['Build',s.osBuild],
    ['Arch',s.osArch],['Manufacturer',s.manufacturer],['Model',s.model],
    ['CPU',s.cpu],['Cores',s.cpuCores+' / '+s.cpuLogical+' (phys/logical)'],
    ['Total RAM',s.totalRamGB+' GB'],['Uptime',s.uptimeHours+' h'],
    ['Last Boot',s.lastBoot],['BIOS',s.biosVersion+' ('+s.biosDate+')'],
    ['Timezone',s.timezone],['Locale',s.locale],
  ]);
  if(h.battery) html += '<h4 style="margin:12px 0 6px">Battery</h4>'+kv(h.battery,[['Name',h.battery.name],['Charge',h.battery.estimatedCharge+'%'],['Runtime',h.battery.estimatedRuntime+' min'],['Status',h.battery.status]]);
  if(h.gpus&&h.gpus.length) html += '<h4 style="margin:12px 0 6px">GPU</h4>'+table(['Name','VRAM (GB)','Driver','Status'], h.gpus.map(g=>[g.name,g.vramGB,g.driver,g.status]));
  if(h.motherboard) html += '<h4 style="margin:12px 0 6px">Motherboard</h4>'+kv(h.motherboard,[['Manufacturer',h.motherboard.manufacturer],['Product',h.motherboard.product]]);
  $('sec-system').innerHTML = html;
})();

// storage
(function(){
  const st=D.storage||{};
  let html='';
  if(st.volumes&&st.volumes.length){
    html += table(['Drive','Label','FS','Type','Size GB','Free GB','Used %'], st.volumes.map(v=>[v.drive,v.label,v.fs,v.type,v.sizeGB,v.freeGB,v.usedPercent+'%']), 'tbl-vol');
  }
  if(st.physicalDisks&&st.physicalDisks.length){
    html += '<h4 style="margin:12px 0 6px">Physical Disks</h4>'+table(['Name','Health','Status','Size GB','Media'], st.physicalDisks.map(d=>[d.name,d.health,d.status,d.sizeGB,d.media]));
  }
  if(st.pageFile&&st.pageFile.length){
    html += '<h4 style="margin:12px 0 6px">Page File</h4>'+table(['Name','Allocated MB','Current MB','Peak MB'], st.pageFile.map(p=>[p.name,p.allocatedMB,p.currentMB,p.peakMB]));
  }
  $('sec-storage').innerHTML = html || '<div class="empty">No data</div>';
})();

// network
(function(){
  const n=D.network||{};
  let html='';
  if(n.ipConfig&&n.ipConfig.length){
    const _a = (x)=> Array.isArray(x)?x.join(', '):(x==null?'':x);
html += '<h4>IP Configuration</h4>'+table(['Alias','IPv4','IPv6','Gateway'], n.ipConfig.map(i=>[i.alias,_a(i.ipv4),_a(i.ipv6),i.gateway]));
  }
  if(n.adapters&&n.adapters.length){
    html += '<h4 style="margin:12px 0 6px">Adapters</h4>'+table(['Name','Description','Status','Speed','MAC'], n.adapters.map(a=>[a.name,a.desc,a.status,a.speed,a.mac]));
  }
  if(n.pings&&n.pings.length){
    html += '<h4 style="margin:12px 0 6px">Ping Tests</h4>'+table(['Target','Success','Latency ms'], n.pings.map(p=>[p.target,p.success?'Yes':'No',p.latency]));
  }
  if(n.dns&&n.dns.length){
    html += '<h4 style="margin:12px 0 6px">DNS</h4>'+table(['Alias','Servers'], n.dns.map(d=>[d.alias,d.servers]));
  }
  if(n.proxy) html += '<div style="margin-top:8px">Proxy: '+esc(n.proxy)+'</div>';
  if(n.listeningPorts&&n.listeningPorts.length){
    html += '<h4 style="margin:12px 0 6px">Listening Ports (top 60)</h4>'+table(['Address','Port','PID','Process'], n.listeningPorts.map(p=>[p.address,p.port,p.pid,p.process]), 'tbl-ports');
  }
  $('sec-network').innerHTML = html || '<div class="empty">No data</div>';
})();

// performance
(function(){
  const p=D.performance||{};
  $('sec-perf').innerHTML = kv(p,[['CPU Load',p.cpuLoadPercent+'%'],['Memory Used',p.memoryUsedPercent+'%'],['Free RAM',p.freeRamMB+' MB'],['Total RAM',p.totalRamMB+' MB'],['Disk Queue',p.diskQueueLength],['Net Bytes/s',p.networkBytesPerSec]]) +
    '<div style="margin-top:10px">CPU '+bar(p.cpuLoadPercent||0)+'</div><div style="margin-top:6px">RAM '+bar(p.memoryUsedPercent||0)+'</div>';
})();

// processes
(function(){
  const p=D.processes||{};
  let html = `<div style="margin-bottom:8px">Total processes: ${esc(p.count)} • Total CPU s: ${esc(p.totalCpuSeconds)}</div>`;
  html += '<h4>Top CPU</h4>'+table(['Name','PID','CPU s','Mem MB','Path'], (p.topCpu||[]).map(x=>[x.name,x.pid,x.cpu,x.memMB,x.path]), 'tbl-cpu');
  html += '<h4 style="margin:12px 0 6px">Top Memory</h4>'+table(['Name','PID','Mem MB','CPU s','Path'], (p.topMemory||[]).map(x=>[x.name,x.pid,x.memMB,x.cpu,x.path]));
  if(p.suspicious&&p.suspicious.length) html += '<h4 style="margin:12px 0 6px">Suspicious (no path)</h4>'+table(['Name','PID','Reason'], p.suspicious.map(x=>[x.name,x.pid,x.reason]));
  $('sec-proc').innerHTML = html;
})();

// services
(function(){
  const s=D.services||{};
  let html = `<div style="margin-bottom:8px">Total: ${esc(s.total)} • Running: ${esc(s.running)} • Failed auto: ${esc((s.failedAuto||[]).length)}</div>`;
  if(s.failedAuto&&s.failedAuto.length) html += '<h4>Failed Auto-Start Services</h4>'+table(['Name','Display','State','Start Mode','Path'], s.failedAuto.map(x=>[x.name,x.display,x.state,x.startMode,x.path]), 'tbl-failedsvc');
  if(s.stoppedServices&&s.stoppedServices.length) html += '<h4 style="margin:12px 0 6px">Stopped Services (top)</h4>'+table(['Name','Display','State','Start Mode'], s.stoppedServices.map(x=>[x.name,x.display,x.state,x.startMode]));
  $('sec-svc').innerHTML = html || '<div class="empty">No data</div>';
})();

// events
(function(){
  const e=D.events||{};
  let html = `<div style="margin-bottom:8px">Window: ${esc(e.hours)}h • Total: ${esc(e.total)}</div>`;
  if(e.bugchecks&&e.bugchecks.length){
    html += '<h4 style="color:var(--red)">BSOD / Crash Events</h4>'+table(['Time','Message'], e.bugchecks.map(b=>[b.time,b.message]));
  }
  if(e.entries&&e.entries.length){
    html += '<h4 style="margin:12px 0 6px">Recent Errors/Warnings</h4>'+table(['Time','Log','Level','Source','ID','Message'], e.entries.map(x=>[x.time,x.log,x.level,x.source,x.id,x.message]), 'tbl-events');
  }
  $('sec-events').innerHTML = html || '<div class="empty">No data</div>';
})();

// updates
(function(){
  const u=D.updates||{};
  let html = `<div style="margin-bottom:8px">Pending: ${esc(u.pendingCount)} • Installed: ${esc(u.installedCount)}</div>`;
  if(u.pending&&u.pending.length) html += table(['Title','Severity','KB'], u.pending.map(x=>[x.title,x.severity,x.kb]));
  if(u.recentFailures&&u.recentFailures.length){
    html += '<h4 style="margin:12px 0 6px">Recent Update Failures</h4>'+table(['Time','Message'], u.recentFailures.map(x=>[x.time,x.message]));
  }
  $('sec-updates').innerHTML = html || '<div class="empty">No data</div>';
})();

// drivers
(function(){
  const d=D.drivers||{};
  let html = `<div style="margin-bottom:8px">Problem devices: ${esc(d.problemCount)}</div>`;
  if(d.problemDevices&&d.problemDevices.length) html += table(['Name','Device ID','Error Code','Status'], d.problemDevices.map(x=>[x.name,x.deviceID,x.errorCode,x.status]));
  if(d.stoppedAutoDrivers&&d.stoppedAutoDrivers.length){
    html += '<h4 style="margin:12px 0 6px">Stopped Auto Drivers</h4>'+table(['Name','Display','State'], d.stoppedAutoDrivers.map(x=>[x.name,x.display,x.state]));
  }
  $('sec-drivers').innerHTML = html || '<div class="empty">No data</div>';
})();

// software
(function(){
  const s=D.software||{};
  let html = `<div style="margin-bottom:8px">Installed apps: ${esc(s.count)}</div>`;
  if(s.apps&&s.apps.length) html += table(['Name','Version','Publisher','Installed','Size KB'], s.apps.map(x=>[x.name,x.version,x.publisher,x.installed,x.sizeKB]), 'tbl-apps');
  if(s.startup&&s.startup.length){
    html += '<h4 style="margin:12px 0 6px">Startup Items</h4>'+table(['Name','Command','Location','User'], s.startup.map(x=>[x.name,x.command,x.location,x.user]));
  }
  $('sec-software').innerHTML = html || '<div class="empty">No data</div>';
})();

// security
(function(){
  const s=D.security||{};
  let html='';
  if(s.firewall&&s.firewall.length) html += '<h4>Firewall Profiles</h4>'+table(['Profile','Enabled'], s.firewall.map(x=>[x.profile,x.enabled?'Yes':'No']));
  if(s.defender) html += '<h4 style="margin:12px 0 6px">Windows Defender</h4>'+kv(s.defender,[['Real-time',s.defender.realTimeProtection],['Antivirus',s.defender.antivirusEnabled],['Antispyware',s.defender.antispywareEnabled],['Defs Updated',s.defender.definitionsUpdated],['Quick Scan Age (days)',s.defender.quickScanAge],['Full Scan Age (days)',s.defender.fullScanAge]]);
  if(s.bitlocker&&s.bitlocker.length) html += '<h4 style="margin:12px 0 6px">BitLocker</h4>'+table(['Drive','Status','Protection'], s.bitlocker.map(x=>[x.drive,x.status,x.protection]));
  const extras = [['Secure Boot',s.secureBoot],['TPM Present',s.tpm?s.tpm.present:'n/a'],['TPM Ready',s.tpm?s.tpm.ready:'n/a'],['UAC Enabled',s.uacEnabled]];
  html += '<h4 style="margin:12px 0 6px">Other</h4>'+kv(Object.fromEntries(extras.map(e=>[e[0],e[1]])), extras.map(e=>[e[0],e[1]]));
  $('sec-security').innerHTML = html || '<div class="empty">No data</div>';
})();

// users
(function(){
  const u=D.users||{};
  let html='';
  if(u.users&&u.users.length) html += table(['Name','Enabled','Last Logon','Password Expires','Description'], u.users.map(x=>[x.name,x.enabled,x.lastLogon,x.passwordExpires,x.description]));
  if(u.administrators&&u.administrators.length){
    html += '<h4 style="margin:12px 0 6px">Administrators</h4>'+table(['Name','Type'], u.administrators.map(x=>[x.name,x.type]));
  }
  if(u.activeSessions&&u.activeSessions.length){
    html += '<h4 style="margin:12px 0 6px">Active Sessions</h4><pre style="font-size:12px">'+esc(u.activeSessions.join('\n'))+'</pre>';
  }
  $('sec-users').innerHTML = html || '<div class="empty">No data</div>';
})();

// reliability
(function(){
  const r=D.reliability||{};
  let html = `<div style="margin-bottom:8px">Window: ${esc(r.days)} days • Records: ${esc(r.count)} • Minidumps: ${esc((r.minidumps||[]).length)}</div>`;
  if(r.minidumps&&r.minidumps.length) html += table(['Name','Date','Size KB'], r.minidumps.map(x=>[x.name,x.date,x.sizeKB]));
  if(r.records&&r.records.length) html += '<h4 style="margin:12px 0 6px">Reliability Records</h4>'+table(['Time','Source','Product','Event ID','Message'], r.records.map(x=>[x.time,x.source,x.product,x.eventId,x.message]), 'tbl-rel');
  $('sec-reliability').innerHTML = html || '<div class="empty">No data</div>';
})();
</script>
</body>
</html>
